*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#061733;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}.app{width:100%;max-width:430px;min-height:94vh;background:linear-gradient(180deg,#08224d,#061733);border:4px solid #fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 25px rgba(0,0,0,.45)}header{background:#031126;padding:13px 10px;text-align:center;border-bottom:3px solid #fff}header h1{font-size:22px;color:#ffdd57}header p{font-size:14px;color:#dbeafe;margin-top:5px}main{flex:1;overflow:hidden}.screen{display:none;height:100%;padding:16px 14px 130px;overflow-y:auto}.screen.active{display:block}h2{font-size:25px;color:#ffdd57;text-align:center;margin-bottom:10px}h3{font-size:20px;color:#7dd3fc;margin:8px 0}p,li{font-size:19px;line-height:1.35;margin-bottom:8px}ul{padding-left:22px}.card{background:#0f3a78;border:2px solid #fff;border-radius:18px;padding:15px;margin:12px 0}input{width:100%;border:3px solid #ffdd57;border-radius:14px;padding:14px;font-size:20px;margin:10px 0;color:#031126;font-weight:bold}.badge{display:inline-block;background:#ffdd57;color:#031126;font-weight:bold;padding:7px 10px;border-radius:999px;margin:4px 3px 8px 0;font-size:14px}.qmeta{text-align:center;margin-bottom:10px}.qnum{font-size:17px;color:#dbeafe;font-weight:bold}.qtema{font-size:15px;color:#ffdd57;font-weight:bold;margin-top:4px}.question{background:#fff;color:#061733;border-radius:16px;padding:15px;font-size:21px;line-height:1.35;font-weight:bold;margin:10px 0}.options{display:grid;gap:10px;margin-top:10px}.opt{background:#dbeafe;color:#061733;border:2px solid #93c5fd;border-radius:14px;padding:13px;font-size:18px;font-weight:bold;text-align:left;cursor:pointer}.opt.correct{background:#16a34a;color:white}.opt.wrong{background:#dc2626;color:white}.opt.disabled{pointer-events:none}.result{border-radius:20px;padding:18px;margin:15px 0;font-size:20px;line-height:1.4;border:3px solid #fff}.okbox{background:#14532d;border-color:#bbf7d0}.nobox{background:#7f1d1d;border-color:#fecaca}.waitbox{background:#334155;border-color:#cbd5e1}.answer{font-size:28px;color:#ffdd57;font-weight:bold;text-align:center;margin:12px 0}.review{background:rgba(255,255,255,.14);border-radius:14px;padding:12px;margin-top:14px}.alert{background:#ffdd57;color:#031126;border-radius:14px;padding:12px;margin-top:12px;font-size:18px;font-weight:bold;text-align:center}.err{display:none;background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:10px;font-size:17px;font-weight:bold;text-align:center;margin-top:8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#031126;border-top:3px solid white;padding:9px}.btnrow{display:flex;gap:7px;flex-wrap:wrap}button{flex:1;border:0;border-radius:13px;padding:12px 6px;background:#ffdd57;color:#031126;font-size:17px;font-weight:bold;cursor:pointer;min-width:30%}.progress{font-size:13px;text-align:center;color:#dbeafe;margin-top:7px}.mini{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;max-height:43px;overflow:hidden}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.ok{background:#16a34a}.dot.no{background:#dc2626}.dot.now{outline:2px solid #ffdd57}.footer{font-size:13px;text-align:center;color:#fff;font-weight:bold;margin-top:5px}.startbtn{width:100%;margin-top:10px;font-size:21px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;color:#061733;border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:bold}@media(max-height:700px){p,li{font-size:17px}.question{font-size:18px}.opt{font-size:16px;padding:10px}h2{font-size:22px}.screen{padding-bottom:125px}}
</style></head><body><div class="app"><header><h1>📘 QUIZ CPC 16 – FGV</h1><p>50 questões teóricas • Questão e gabarito em telas separadas</p></header><main id="main"></main><nav><div class="btnrow"><button onclick="prevScreen()">⬅ Voltar</button><button onclick="nextScreen()">Avançar ➡</button><button onclick="continueSaved()">▶ Continuar</button><button onclick="restart()">🔄 Reiniciar</button></div><div class="progress" id="progress"></div><div class="mini" id="mini"></div><div class="footer">Curso de Contabilidade Professor Moreira</div></nav></div><script>
const questions=[{"t": "Mensuração", "q": "De acordo com o CPC 16, os estoques devem ser mensurados:", "o": ["pelo maior valor entre custo e valor justo", "pelo menor valor entre custo e valor realizável líquido", "sempre pelo preço de venda", "sempre pelo custo corrigido", "pelo valor de reposição"], "a": 1, "e": "A regra central é mensurar estoques pelo menor valor entre custo e valor realizável líquido."}, {"t": "VRL", "q": "Valor realizável líquido é:", "o": ["preço de compra menos tributos recuperáveis", "preço de venda estimado menos custos para concluir e vender", "valor justo mais lucro", "custo corrigido", "valor de mercado sem dedução"], "a": 1, "e": "VRL é o preço de venda estimado deduzido dos custos de conclusão e gastos para venda."}, {"t": "Frete sobre compras", "q": "O frete sobre compras deve ser:", "o": ["despesa comercial", "custo do estoque", "receita financeira", "despesa financeira", "patrimônio líquido"], "a": 1, "e": "Frete sobre compras necessário para trazer o estoque ao local atual integra o custo."}, {"t": "ICMS recuperável", "q": "O ICMS recuperável na compra para revenda deve ser:", "o": ["custo do estoque", "despesa", "direito no ativo", "receita", "perda"], "a": 2, "e": "Tributos recuperáveis não entram no custo; são registrados como direitos."}, {"t": "Tributo não recuperável", "q": "Tributo não recuperável na compra deve ser:", "o": ["deduzido", "despesa financeira", "custo do estoque", "receita", "PL"], "a": 2, "e": "Tributos não recuperáveis integram o custo de aquisição."}, {"t": "Desconto comercial", "q": "Desconto comercial obtido na compra:", "o": ["é receita financeira", "reduz o custo do estoque", "é despesa", "é passivo", "é ajuste patrimonial"], "a": 1, "e": "Descontos comerciais reduzem o custo de aquisição."}, {"t": "Desconto financeiro", "q": "Desconto financeiro por pagamento no prazo:", "o": ["reduz estoque", "é receita financeira", "é custo de transformação", "é perda", "é despesa antecipada"], "a": 1, "e": "Desconto financeiro não altera o custo; em regra, é receita financeira."}, {"t": "Compra a prazo", "q": "Compra a prazo com juros embutidos relevantes:", "o": ["estoque pelo valor total a prazo", "estoque pelo preço à vista e juros como despesa financeira", "estoque pelo valor justo mais juros", "só no vencimento", "valor de reposição"], "a": 1, "e": "Juros embutidos são elemento de financiamento e não compõem estoque."}, {"t": "Frete sobre vendas", "q": "Frete para entregar mercadoria ao cliente é:", "o": ["custo do estoque", "custo de aquisição", "despesa comercial", "estoque", "tributo recuperável"], "a": 2, "e": "Frete sobre vendas é gasto de comercialização."}, {"t": "Seguro na compra", "q": "Seguro no transporte da compra é:", "o": ["despesa financeira", "despesa comercial", "custo do estoque", "perda", "receita"], "a": 2, "e": "Seguro diretamente atribuível à aquisição integra o custo."}, {"t": "Transformação", "q": "Custos de transformação incluem:", "o": ["propaganda e comissão", "MOD e custos indiretos de fabricação", "frete sobre vendas e juros", "despesas administrativas", "desconto financeiro"], "a": 1, "e": "Custos de transformação incluem mão de obra direta e custos indiretos de produção."}, {"t": "MOD", "q": "Mão de obra direta na produção é:", "o": ["custo de transformação", "despesa comercial", "excluída do estoque", "receita", "PL"], "a": 0, "e": "A MOD integra o custo dos estoques produzidos."}, {"t": "CIF fixo", "q": "Custos indiretos fixos são alocados com base:", "o": ["capacidade normal", "preço de venda", "valor justo", "lucro desejado", "prazo"], "a": 0, "e": "A alocação dos CIF fixos deve usar a capacidade normal."}, {"t": "Ociosidade", "q": "Custos não alocados por ociosidade são:", "o": ["aumento do estoque", "despesa do período", "intangível", "mantidos no estoque", "receita diferida"], "a": 1, "e": "A ociosidade não pode aumentar o custo unitário dos estoques."}, {"t": "Desperdício anormal", "q": "Desperdício anormal deve ser:", "o": ["custo do estoque", "despesa do período", "estoque em elaboração", "tributo", "VRL"], "a": 1, "e": "Desperdícios anormais são despesas do período."}, {"t": "Armazenamento", "q": "Armazenamento entra no custo quando:", "o": ["posterior à venda", "necessário ao processo produtivo entre fases", "pago à vista", "administrativo", "relativo ao vendido"], "a": 1, "e": "Armazenamento só entra se necessário ao processo produtivo."}, {"t": "Administração", "q": "Despesas administrativas gerais devem ser:", "o": ["estoque", "despesa do período", "estoque de segurança", "VRL", "custo direto"], "a": 1, "e": "Despesas administrativas gerais não compõem estoque."}, {"t": "Comissão", "q": "Comissão de vendedores é:", "o": ["custo do estoque", "despesa comercial", "custo de transformação", "tributo", "estoque em trânsito"], "a": 1, "e": "Comissão é gasto de venda."}, {"t": "Propaganda", "q": "Propaganda para vender produtos é:", "o": ["estoque", "ativo biológico", "despesa do período", "custo de transformação", "imposto"], "a": 2, "e": "Propaganda e marketing são despesas."}, {"t": "PEPS", "q": "PEPS significa:", "o": ["último entra primeiro sai", "primeiro entra primeiro sai", "maior valor", "preço de venda", "valor justo"], "a": 1, "e": "PEPS: Primeiro que Entra, Primeiro que Sai."}, {"t": "Média", "q": "Custo médio ponderado usa:", "o": ["maior preço", "média ponderada dos custos disponíveis", "preço de venda", "valor justo", "último custo"], "a": 1, "e": "Custo médio usa média ponderada dos itens disponíveis."}, {"t": "Identificação", "q": "Identificação específica é para:", "o": ["itens não intercambiáveis/projetos específicos", "mercadorias comuns", "inflação", "obsolescência", "desconto financeiro"], "a": 0, "e": "Usada para itens não intercambiáveis ou projetos específicos."}, {"t": "UEPS", "q": "UEPS no CPC 16 é:", "o": ["obrigatório", "permitido no comércio", "permitido na indústria", "não permitido", "obrigatório na inflação"], "a": 3, "e": "O CPC 16 não permite UEPS."}, {"t": "Varejo", "q": "Método de varejo usa:", "o": ["custo mais lucro", "preço de venda menos margem bruta", "valor justo", "exclusão de fretes", "despesas comerciais"], "a": 1, "e": "No método de varejo, reduz-se o preço de venda pela margem bruta."}, {"t": "Custo-padrão", "q": "Custo-padrão pode ser usado quando:", "o": ["sempre substitui o real", "aproxima o custo real", "maior que VRL", "igual ao preço", "inclui vendas"], "a": 1, "e": "Pode ser usado se aproximar o custo real."}, {"t": "Redução ao VRL", "q": "Se VRL < custo, a entidade deve:", "o": ["manter custo", "aumentar ao preço", "reconhecer perda ao VRL", "receita financeira", "imobilizar"], "a": 2, "e": "Se o VRL for menor, reconhece-se perda."}, {"t": "Conta redutora", "q": "Perda estimada ao VRL é conta:", "o": ["devedora que aumenta estoque", "credora que reduz ativo", "receita", "passivo", "PL"], "a": 1, "e": "É conta redutora do ativo, credora."}, {"t": "Reversão", "q": "Reversão de perda em estoques é:", "o": ["proibida", "sem limite", "permitida até o valor da perda anterior", "PL", "aumento acima do custo"], "a": 2, "e": "A reversão é limitada à perda reconhecida anteriormente."}, {"t": "Venda", "q": "Quando vendido, o custo do estoque vira:", "o": ["ativo permanente", "despesa no período da receita", "receita diferida", "Ajuste patrimonial", "só no pagamento"], "a": 1, "e": "O custo é reconhecido no mesmo período da receita."}, {"t": "CMV lançamento", "q": "Baixa no inventário permanente:", "o": ["D Estoques C CMV", "D CMV C Estoques", "D Caixa C Estoques", "D Receita C Estoques", "D Estoques C Receita"], "a": 1, "e": "A baixa é D – CMV / C – Estoques."}, {"t": "CMV fórmula", "q": "Fórmula do CMV:", "o": ["EF+Compras-EI", "EI+Compras Líquidas-EF", "Receita-Lucro", "EF x preço", "VRL-custo"], "a": 1, "e": "CMV = EI + Compras Líquidas − EF."}, {"t": "Trânsito", "q": "Mercadorias em trânsito são estoque quando:", "o": ["não há nota", "controle/riscos já são da compradora", "frete pago vendedor sempre", "já vendidas", "sem obrigação"], "a": 1, "e": "Depende da transferência do controle/riscos e benefícios."}, {"t": "Imóveis", "q": "Imóveis construídos para venda por incorporadora são:", "o": ["imobilizado", "estoques", "intangível", "propriedade para investimento", "PL"], "a": 1, "e": "Imóveis para venda no curso normal são estoques."}, {"t": "Consignação", "q": "Bens de terceiros em consignação são estoque próprio?", "o": ["sim, estão na loja", "sim, se vender", "não, pertencem a terceiros", "sim, se há comissão", "sim, ativo circulante"], "a": 2, "e": "Bens de terceiros não são estoque próprio."}, {"t": "Dano", "q": "Produtos danificados sem recuperação exigem:", "o": ["manter custo", "ajuste ao VRL ou baixa", "aumentar reposição", "receita", "PL"], "a": 1, "e": "Dano pode exigir ajuste ou baixa."}, {"t": "Validade", "q": "Produtos vencidos sem venda geram:", "o": ["aumento estoque", "baixa e despesa/perda", "receita diferida", "intangível", "reserva"], "a": 1, "e": "Sem recuperação econômica, baixa-se o estoque."}, {"t": "Sinistro", "q": "Perdas por incêndio/enchente são:", "o": ["despesa/perda", "custo normal", "estoque elaboração", "receita", "tributo"], "a": 0, "e": "Sinistros são perdas anormais no resultado."}, {"t": "Valor justo x VRL", "q": "Valor justo e VRL:", "o": ["sempre iguais", "VRL é específico da entidade; valor justo é mercado", "valor justo substitui custo", "VRL ignora vendas", "sempre maiores"], "a": 1, "e": "VRL é específico da entidade; valor justo reflete mercado."}, {"t": "Reposição", "q": "Preço de reposição aumentou. Deve-se:", "o": ["aumentar estoque", "manter custo salvo regra custo x VRL", "receita financeira", "imobilizado", "ajuste PL"], "a": 1, "e": "Aumento de reposição não aumenta automaticamente estoque."}, {"t": "Materiais", "q": "Materiais não são reduzidos abaixo do custo quando:", "o": ["obsoletos", "produto final venderá pelo custo ou acima", "fornecedor aumentou preço", "outro local", "sempre houver perda"], "a": 1, "e": "Se o produto final recupera o custo, materiais não são reduzidos."}, {"t": "Agrícola", "q": "Produto agrícola colhido entra inicialmente pelo:", "o": ["custo da semente", "valor justo menos gastos no ponto de venda", "preço futuro", "reposição", "média anos"], "a": 1, "e": "Na colheita, esse valor vira custo inicial."}, {"t": "Divulgação", "q": "Demonstrações devem divulgar:", "o": ["unidades físicas", "políticas, critérios e valores escriturados", "preço venda", "estoque vencido", "método fiscal"], "a": 1, "e": "Devem divulgar políticas, critérios e valores dos estoques."}, {"t": "Garantia", "q": "Estoques dados em garantia devem ser:", "o": ["baixados", "divulgados", "transferidos ao PL", "receita", "excluídos sempre"], "a": 1, "e": "O montante dado em garantia deve ser divulgado."}, {"t": "Despesa", "q": "Valor dos estoques reconhecido como despesa deve ser:", "o": ["ignorado", "divulgado", "investimento", "passivo", "reserva"], "a": 1, "e": "O valor reconhecido como despesa deve ser divulgado."}, {"t": "Serviços", "q": "Estoques de serviços podem ser:", "o": ["salários administrativos", "custos de serviço em andamento ainda sem receita", "receitas antecipadas", "despesas comerciais", "patrimônio"], "a": 1, "e": "Podem existir custos de serviços em andamento."}, {"t": "Lucro esperado", "q": "Margem de lucro esperada entra no custo?", "o": ["sim sempre", "sim quando vendido", "não", "sim se lucro bruto", "sim se preço aumentar"], "a": 2, "e": "Custo não inclui lucro esperado."}, {"t": "Gastos venda", "q": "Na apuração do VRL, gastos para vender são:", "o": ["somados", "deduzidos", "ignorados", "estoque adicional", "receita"], "a": 1, "e": "VRL deduz gastos necessários para venda."}, {"t": "Custo acima VRL", "q": "Custo R$100 e VRL R$90. Estoque por:", "o": ["100", "95", "90", "190", "10"], "a": 2, "e": "Usa-se o menor: R$ 90."}, {"t": "Custo abaixo VRL", "q": "Custo R$100 e VRL R$130. Estoque por:", "o": ["130", "115", "100", "30", "230"], "a": 2, "e": "Usa-se o menor: R$ 100."}, {"t": "Curso normal", "q": "Mercadorias para revenda são:", "o": ["imobilizado", "ativo circulante - estoques", "PL", "despesa antecipada", "investimento"], "a": 1, "e": "Mercadorias para revenda são estoques."}];let current=0,answers=Array(questions.length).fill(null),aluno=localStorage.getItem('quiz_cpc16_aluno')||"";const main=document.getElementById('main'),letters=['A','B','C','D','E'];
function render(){let html=`<section class="screen intro"><h2>🚀 Comece o Quiz</h2><div class="card"><span class="badge">📱 Celular</span><span class="badge">🎯 CPC 16</span><span class="badge">🏆 FGV</span><span class="badge">✅ 50 questões</span><p>Digite seu nome para iniciar ou continuar.</p><input id="studentName" placeholder="Nome do aluno" value="${aluno}"><div class="err" id="nameError">Digite o nome antes de iniciar.</div><p><strong>Modelo:</strong> primeira tela com a questão; segunda tela com gabarito, acerto/erro, comentário e revisão rápida.</p><button class="startbtn" onclick="startQuiz()">▶ Iniciar Quiz</button><button class="startbtn" onclick="continueSaved()">▶ Continuar de onde parei</button></div></section>`;questions.forEach((q,i)=>{html+=`<section class="screen"><div class="qmeta"><div class="qnum">Questão ${i+1} de ${questions.length}</div><div class="qtema">FGV • ${q.t}</div></div><div class="question">${q.q}</div><div class="options">${q.o.map((o,idx)=>`<button class="opt" id="opt-${i}-${idx}" onclick="answer(${i},${idx})">${letters[idx]}) ${o}</button>`).join('')}</div><div class="alert">Responda e avance para ver o gabarito comentado ➡</div></section>`;html+=`<section class="screen"><div class="qmeta"><div class="qnum">Gabarito da Questão ${i+1}</div><div class="qtema">FGV • ${q.t}</div></div><div id="result-${i}" class="result waitbox"></div></section>`;});html+=`<section class="screen"><h2>🏁 Fim do Quiz</h2><div class="card"><p>Parabéns, <strong id="finalName">${aluno||'Aluno'}</strong>!</p><p>Você concluiu as 50 questões teóricas do CPC 16.</p><div class="stats"><div class="stat">✅ Acertos<br><span id="endOk">0</span></div><div class="stat">❌ Erros<br><span id="endNo">0</span></div></div><button class="startbtn" onclick="restart()">🔄 Fazer novamente</button></div></section>`;main.innerHTML=html;restoreVisualAnswers();updateResultBoxes();show(current);}
function startQuiz(){const inp=document.getElementById('studentName'),err=document.getElementById('nameError');const nome=(inp?inp.value:"").trim();if(nome.length<3){if(err)err.style.display='block';if(inp)inp.focus();return;}aluno=nome;localStorage.setItem('quiz_cpc16_aluno',aluno);if(current===0)current=1;show(current);}
function continueSaved(){const saved=parseInt(localStorage.getItem('quiz_cpc16_current'));const savedAluno=localStorage.getItem('quiz_cpc16_aluno')||aluno;if(savedAluno)aluno=savedAluno;if(!isNaN(saved)&&saved>0)show(saved);else startQuiz();}
function show(idx){const screens=document.querySelectorAll('.screen');if(idx<0)idx=0;if(idx>=screens.length)idx=screens.length-1;if(idx>0&&!aluno)current=0;else current=idx;screens.forEach(s=>s.classList.remove('active'));screens[current].classList.add('active');localStorage.setItem('quiz_cpc16_current',current);updateProgress();updateResultBoxes();if(current===questions.length*2+1)updateEnd();window.scrollTo(0,0);}
function nextScreen(){if(current===0){startQuiz();return;}show(current+1)}function prevScreen(){show(current-1)}function restart(){current=0;answers=Array(questions.length).fill(null);localStorage.removeItem('quiz_cpc16_answers');localStorage.removeItem('quiz_cpc16_current');render();}
function answer(qi,oi){if(answers[qi]!==null)return;answers[qi]=oi;localStorage.setItem('quiz_cpc16_answers',JSON.stringify(answers));markOptions(qi);updateProgress();updateResultBoxes();}
function markOptions(qi){const q=questions[qi];q.o.forEach((_,idx)=>{const el=document.getElementById(`opt-${qi}-${idx}`);if(!el)return;el.classList.add('disabled');if(idx===q.a)el.classList.add('correct');if(answers[qi]===idx&&idx!==q.a)el.classList.add('wrong');});}
function updateResultBoxes(){questions.forEach((q,i)=>{const box=document.getElementById(`result-${i}`);if(!box)return;const resp=answers[i],ok=resp===q.a,status=resp===null?'⚪ QUESTÃO AINDA NÃO RESPONDIDA':(ok?'🟢 VOCÊ ACERTOU!':'🔴 VOCÊ ERROU!'),sua=resp===null?'Não respondida':letters[resp];box.className='result '+(resp===null?'waitbox':(ok?'okbox':'nobox'));box.innerHTML=`<div class="answer">${status}</div><p><strong>Sua resposta:</strong> ${sua}</p><p><strong>Gabarito:</strong> ${letters[q.a]}</p><p>${q.e}</p><div class="review"><h3>📌 Revisão rápida</h3><ul><li>Estoques são mensurados pelo menor entre custo e VRL.</li><li>Tributos recuperáveis não integram o custo.</li><li>Frete sobre compras integra o custo.</li><li>Frete sobre vendas é despesa.</li></ul></div>`;});}
function restoreVisualAnswers(){questions.forEach((_,i)=>{if(answers[i]!==null)setTimeout(()=>markOptions(i),0);});}
function updateProgress(){const total=questions.length*2+2,ok=answers.filter((a,i)=>a===questions[i].a).length,done=answers.filter(a=>a!==null).length,no=done-ok;document.getElementById('progress').innerText=`Tela ${current+1} de ${total} • ${aluno?('Aluno: '+aluno+' • '):''}Respondidas: ${done}/${questions.length} • ✅ ${ok} • ❌ ${no}`;document.getElementById('mini').innerHTML=questions.map((q,i)=>{let cls='dot';if(answers[i]!==null)cls+=answers[i]===q.a?' ok':' no';if(current===i*2+1||current===i*2+2)cls+=' now';return `<span class="${cls}"></span>`;}).join('');}
function updateEnd(){const ok=answers.filter((a,i)=>a===questions[i].a).length,done=answers.filter(a=>a!==null).length,no=done-ok;document.getElementById('endOk').textContent=ok;document.getElementById('endNo').textContent=no;const fn=document.getElementById('finalName');if(fn)fn.textContent=aluno||'Aluno';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScreen();if(e.key==='ArrowLeft')prevScreen();});
try{const sa=JSON.parse(localStorage.getItem('quiz_cpc16_answers'));if(Array.isArray(sa)&&sa.length===questions.length)answers=sa;const sc=parseInt(localStorage.getItem('quiz_cpc16_current'));if(!isNaN(sc))current=sc;}catch(e){}render();
</script></body></html>
