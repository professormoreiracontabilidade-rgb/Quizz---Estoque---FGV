<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#061733;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}.app{width:100%;max-width:430px;min-height:94vh;background:linear-gradient(180deg,#08224d,#061733);border:4px solid #fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 25px #0008}header{background:#031126;padding:13px 10px;text-align:center;border-bottom:3px solid #fff}header h1{font-size:22px;color:#ffdd57}header p{font-size:14px;color:#dbeafe;margin-top:5px}main{flex:1;overflow:hidden}.screen{display:none;height:100%;padding:16px 14px 134px;overflow-y:auto}.screen.active{display:block}h2{font-size:25px;color:#ffdd57;text-align:center;margin-bottom:10px}h3{font-size:20px;color:#7dd3fc;margin:8px 0}p,li{font-size:19px;line-height:1.35;margin-bottom:8px}ul{padding-left:22px;margin:8px 0}.card{background:#0f3a78;border:2px solid #fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 8px 18px #0004}input{width:100%;border:3px solid #ffdd57;border-radius:14px;padding:14px;font-size:20px;margin:10px 0;color:#031126;font-weight:bold}.badge{display:inline-block;background:#ffdd57;color:#031126;font-weight:bold;padding:7px 10px;border-radius:999px;margin:4px 3px 8px 0;font-size:14px}.qmeta{text-align:center;margin-bottom:10px}.qnum{font-size:17px;color:#dbeafe;font-weight:bold}.qtema{font-size:15px;color:#ffdd57;font-weight:bold;margin-top:4px}.question{background:#fff;color:#061733;border-radius:16px;padding:15px;font-size:21px;line-height:1.35;font-weight:bold;margin:10px 0}.options{display:grid;gap:10px;margin-top:10px}.opt{background:#dbeafe;color:#061733;border:2px solid #93c5fd;border-radius:14px;padding:13px;font-size:18px;font-weight:bold;text-align:left;cursor:pointer}.opt.correct{background:#16a34a;color:white;border-color:#bbf7d0}.opt.wrong{background:#dc2626;color:white;border-color:#fecaca}.opt.disabled{pointer-events:none;opacity:.95}.comment{background:#14532d;color:white;border:3px solid #bbf7d0;border-radius:20px;padding:18px;margin:15px 0;font-size:20px;line-height:1.4}.answer{font-size:28px;color:#ffdd57;font-weight:bold;text-align:center;margin:12px 0}.alert{background:#ffdd57;color:#031126;border-radius:14px;padding:12px;margin-top:12px;font-size:18px;font-weight:bold;text-align:center}.err{display:none;background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:10px;font-size:17px;font-weight:bold;text-align:center;margin-top:8px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#031126;border-top:3px solid white;padding:9px}.btnrow{display:flex;gap:7px;flex-wrap:wrap}button{flex:1;border:0;border-radius:13px;padding:12px 6px;background:#ffdd57;color:#031126;font-size:17px;font-weight:bold;cursor:pointer;min-width:30%}button:active{transform:scale(.96)}.progress{font-size:13px;text-align:center;color:#dbeafe;margin-top:7px}.mini{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;max-height:43px;overflow:hidden}.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.ok{background:#16a34a}.dot.no{background:#dc2626}.dot.now{outline:2px solid #ffdd57}.footer{font-size:13px;text-align:center;color:#fff;font-weight:bold;margin-top:5px}.startbtn{width:100%;margin-top:10px;font-size:21px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;color:#061733;border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:bold}@media(max-height:700px){p,li{font-size:17px}.question{font-size:18px}.opt{font-size:16px;padding:10px}h2{font-size:22px}.screen{padding-bottom:130px}}</style></head>
<body><div class="app"><header><h1>📘 QUIZ CPC 16 – FGV</h1><p>50 questões teóricas • Questão e gabarito em telas separadas</p></header><main id="main"></main><nav><div class="btnrow"><button onclick="prevScreen()">⬅ Voltar</button><button onclick="nextScreen()">Avançar ➡</button><button onclick="continueSaved()">▶ Continuar</button><button onclick="restart()">🔄 Reiniciar</button></div><div class="progress" id="progress"></div><div class="mini" id="mini"></div><div class="footer">Curso de Contabilidade Professor Moreira</div></nav></div>
<script>
const questions = [
['Mensuração de estoques','De acordo com o CPC 16, os estoques devem ser mensurados:',['pelo maior valor entre custo e valor justo.','pelo menor valor entre custo e valor realizável líquido.','sempre pelo preço de venda.','sempre pelo custo histórico corrigido.','pelo valor de reposição.'],1,'A regra central do CPC 16 é mensurar os estoques pelo menor valor entre o custo e o valor realizável líquido.'],
['Valor realizável líquido','O valor realizável líquido corresponde:',['ao preço de compra deduzido dos tributos recuperáveis.','ao preço de venda estimado menos os custos para conclusão e os gastos necessários para vender.','ao valor justo acrescido da margem de lucro.','ao custo histórico atualizado pelo índice de inflação.','ao valor de mercado sem qualquer dedução.'],1,'VRL = preço de venda estimado menos custos para conclusão e gastos necessários para vender.'],
['Custo de aquisição','Integra o custo de aquisição dos estoques:',['frete sobre compras.','frete sobre vendas.','comissão de vendedores.','propaganda institucional.','despesas administrativas gerais.'],0,'O frete sobre compras é necessário para trazer o estoque ao local atual e integra o custo.'],
['Tributos recuperáveis','Na compra de mercadorias para revenda, o ICMS recuperável deve ser:',['incluído no custo do estoque.','registrado como despesa operacional.','registrado como direito no ativo.','registrado como receita financeira.','registrado como patrimônio líquido.'],2,'Tributos recuperáveis não integram o custo; são registrados como direitos, como ICMS a recuperar.'],
['Tributos não recuperáveis','Os tributos não recuperáveis incidentes na aquisição de estoques devem ser:',['deduzidos do custo.','reconhecidos como despesa financeira.','incluídos no custo do estoque.','lançados diretamente no patrimônio líquido.','tratados como receita diferida.'],2,'Tributos não recuperáveis junto ao Fisco integram o custo de aquisição.'],
['Desconto comercial','O desconto comercial obtido na compra de mercadorias deve ser tratado como:',['receita financeira.','redução do custo do estoque.','despesa comercial.','passivo circulante.','ajuste de avaliação patrimonial.'],1,'Descontos comerciais e abatimentos são deduzidos do custo de aquisição.'],
['Desconto financeiro','O desconto financeiro obtido pelo pagamento dentro do prazo deve ser tratado, em regra, como:',['redução do custo do estoque.','receita financeira.','custo de transformação.','perda estimada.','despesa antecipada.'],1,'Desconto financeiro não altera o custo do estoque; em regra, é receita financeira.'],
['Compra a prazo','Quando a compra de estoque a prazo contém juros embutidos relevantes, o estoque deve ser reconhecido:',['pelo valor total a prazo.','pelo preço à vista, separando os juros como despesa financeira ao longo do prazo.','pelo valor justo acrescido dos juros.','somente no vencimento do pagamento.','pelo valor de reposição.'],1,'O elemento de financiamento não integra o estoque. A diferença é despesa financeira ao longo do período.'],
['Frete sobre vendas','O frete pago para entregar mercadorias ao cliente após a venda deve ser reconhecido como:',['custo do estoque.','custo de aquisição.','despesa comercial.','ativo circulante estoque.','tributo recuperável.'],2,'Frete sobre vendas é gasto de comercialização e deve ser despesa.'],
['Seguro na compra','O seguro contratado para transportar mercadorias adquiridas até o estabelecimento da compradora deve ser:',['despesa financeira.','despesa comercial.','incluído no custo do estoque.','excluído da contabilidade.','registrado como perda.'],2,'Seguro relacionado ao transporte de compra é diretamente atribuível à aquisição.'],
['Custos de transformação','São exemplos de custos de transformação dos estoques:',['propaganda e comissão.','mão de obra direta e custos indiretos de fabricação.','frete sobre vendas e juros bancários.','despesas administrativas e comerciais.','descontos financeiros obtidos.'],1,'Custos de transformação incluem custos diretamente relacionados às unidades produzidas e custos indiretos.'],
['Mão de obra direta','A mão de obra direta empregada na produção de mercadorias deve ser:',['incluída no custo de transformação.','registrada como despesa comercial.','excluída do estoque.','reconhecida como receita.','lançada no patrimônio líquido.'],0,'A mão de obra direta compõe o custo de transformação dos estoques produzidos.'],
['Custos indiretos fixos','Os custos indiretos fixos de fabricação devem ser alocados aos produtos com base:',['na capacidade normal de produção.','no preço de venda.','no valor justo.','no lucro desejado.','no prazo de recebimento.'],0,'A alocação dos custos fixos indiretos deve ser baseada na capacidade normal de produção.'],
['Ociosidade','Os custos fixos não alocados aos produtos em razão de ociosidade devem ser:',['aumentados no custo unitário dos estoques.','reconhecidos como despesa no período.','lançados como ativo intangível.','mantidos no estoque até a venda.','registrados como receita diferida.'],1,'O estoque não pode ser inflado por baixa produção; ociosidade é despesa.'],
['Desperdício anormal','O valor anormal de desperdício de materiais, mão de obra ou outros insumos deve ser:',['incluído no custo do estoque.','reconhecido como despesa do período.','registrado como estoque em elaboração.','tratado como tributo recuperável.','adicionado ao valor realizável líquido.'],1,'Desperdícios anormais não integram o custo do estoque.'],
['Armazenamento','Gastos com armazenamento são incluídos no custo do estoque apenas quando:',['forem posteriores à venda.','forem necessários ao processo produtivo entre uma fase e outra.','forem pagos à vista.','forem despesas administrativas.','forem relativos ao produto vendido.'],1,'Armazenamento normalmente é despesa, salvo quando necessário ao processo produtivo.'],
['Despesas administrativas','Despesas administrativas que não contribuem para colocar o estoque no local e condição atuais devem ser:',['incluídas no estoque.','reconhecidas como despesas do período.','ativadas como estoque de segurança.','incluídas no valor realizável líquido.','registradas como custo direto.'],1,'Despesas administrativas gerais não são custo do estoque.'],
['Despesas comerciais','Comissões de vendedores relacionadas à venda de mercadorias são:',['custo do estoque.','despesas comerciais.','custos de transformação.','tributos recuperáveis.','estoques em trânsito.'],1,'Comissões de vendedores são gastos de venda.'],
['Propaganda','Gastos com propaganda para venda de produtos devem ser reconhecidos como:',['estoque.','ativo biológico.','despesa do período.','custo de transformação.','imposto recuperável.'],2,'Propaganda e marketing são despesas do período.'],
['PEPS','O critério PEPS pressupõe que:',['os últimos itens comprados sejam vendidos primeiro.','os primeiros itens comprados sejam vendidos primeiro.','todos os itens sejam avaliados pelo maior valor.','o estoque seja avaliado pelo preço de venda.','o custo seja sempre igual ao valor justo.'],1,'PEPS significa Primeiro que Entra, Primeiro que Sai.'],
['Custo médio ponderado','No custo médio ponderado, o custo unitário é determinado:',['pelo maior preço de compra.','pela média ponderada dos custos dos itens disponíveis.','pelo preço de venda líquido.','pelo valor justo na data do balanço.','pelo último custo de aquisição.'],1,'O custo médio ponderado considera o custo dos itens existentes e adquiridos/produzidos.'],
['Identificação específica','A identificação específica é apropriada para estoques:',['de itens não normalmente intercambiáveis ou segregados para projetos específicos.','de mercadorias comuns em grandes quantidades.','sempre que houver inflação.','quando o estoque for obsoleto.','quando houver desconto financeiro.'],0,'Indicada para itens não intercambiáveis e projetos específicos.'],
['UEPS','O critério UEPS, segundo o CPC 16, é:',['obrigatório.','permitido apenas para comércio.','permitido apenas para indústria.','não permitido.','obrigatório em inflação.'],3,'O CPC 16 não permite UEPS.'],
['Método de varejo','O método de varejo mensura o custo do estoque pela:',['soma do custo com o lucro líquido.','redução do preço de venda pela margem bruta apropriada.','aplicação do valor justo sem deduções.','exclusão de todos os fretes.','capitalização de despesas comerciais.'],1,'No método de varejo, o custo é o preço de venda menos margem bruta apropriada.'],
['Custo-padrão','O custo-padrão pode ser usado para mensurar estoques quando:',['sempre substituir o custo real, sem revisão.','seus resultados se aproximarem do custo real.','for maior que o valor realizável líquido.','for igual ao preço de venda.','incluir despesas comerciais.'],1,'Pode ser usado por conveniência se aproximar o custo real.'],
['Redução ao VRL','Quando o valor realizável líquido é menor que o custo, a entidade deve:',['manter o estoque pelo custo.','aumentar o estoque ao preço de venda.','reconhecer perda por redução ao VRL.','registrar receita financeira.','transferir o estoque para imobilizado.'],2,'Se o VRL for menor, reconhece-se perda para ajustar o estoque.'],
['Conta redutora','A perda estimada para ajuste ao valor realizável líquido é uma conta:',['devedora que aumenta o estoque.','credora que reduz o ativo.','de receita financeira.','do passivo circulante.','do patrimônio líquido.'],1,'É conta redutora do ativo, com natureza credora.'],
['Reversão da perda','A reversão de perda anteriormente reconhecida em estoques é:',['sempre proibida.','permitida sem limite.','permitida, limitada ao valor da perda anteriormente reconhecida.','registrada diretamente no patrimônio líquido.','tratada como aumento do custo original acima do custo.'],2,'A reversão é permitida, limitada à perda anteriormente reconhecida.'],
['Estoque vendido','Quando o estoque é vendido, seu custo deve ser reconhecido:',['como ativo permanente.','como despesa no período da receita correspondente.','como receita diferida.','como ajuste de avaliação patrimonial.','somente quando o cliente pagar.'],1,'O custo é reconhecido no mesmo período da receita correspondente.'],
['Lançamento do CMV','No sistema de inventário permanente, a baixa do estoque vendido é registrada por:',['D – Estoques / C – CMV.','D – CMV / C – Estoques.','D – Caixa / C – Estoques.','D – Receita / C – Estoques.','D – Estoques / C – Receita.'],1,'Baixa do estoque vendido: D – CMV / C – Estoques.'],
['CMV','A fórmula básica do custo das mercadorias vendidas é:',['CMV = EF + Compras − EI.','CMV = EI + Compras Líquidas − EF.','CMV = Receita − Lucro líquido.','CMV = Estoque Final × Preço de Venda.','CMV = VRL − Custo.'],1,'CMV = Estoque Inicial + Compras Líquidas − Estoque Final.'],
['Estoque em trânsito','Mercadorias em trânsito podem ser reconhecidas como estoque pela compradora quando:',['a nota fiscal ainda não existir.','o controle/riscos e benefícios já forem da compradora.','o frete for pago pelo vendedor em qualquer situação.','o produto já tiver sido vendido ao consumidor final.','a compradora ainda não tiver obrigação.'],1,'Depende da transferência do controle/riscos e benefícios.'],
['Imóveis para venda','Imóveis construídos por incorporadora para venda no curso normal dos negócios são classificados como:',['imobilizado.','estoques.','intangível.','propriedade para investimento.','patrimônio líquido.'],1,'Imóveis para venda no curso normal são estoques.'],
['Bens em consignação','Mercadorias de terceiros recebidas para venda em consignação devem ser reconhecidas como estoque próprio da entidade?',['Sim, porque estão fisicamente na loja.','Sim, se forem vendidas no futuro.','Não, pois pertencem a terceiros.','Sim, se houver comissão.','Sim, se estiverem no ativo circulante.'],2,'A entidade não reconhece como estoque próprio bens de terceiros.'],
['Produtos danificados','Se produtos em estoque forem danificados e seu custo não for recuperável, a entidade deve:',['manter o custo original.','reconhecer ajuste ao valor realizável líquido ou baixa, conforme o caso.','aumentar o estoque pelo preço de reposição.','registrar receita operacional.','transferir para patrimônio líquido.'],1,'Dano pode exigir ajuste ao VRL ou baixa.'],
['Validade vencida','Produtos vencidos, sem possibilidade de venda, devem gerar:',['aumento do estoque.','baixa do estoque e reconhecimento de despesa/perda.','receita diferida.','ativo intangível.','reserva de lucros.'],1,'Sem recuperação econômica, baixa-se o estoque e reconhece-se perda.'],
['Incêndio ou enchente','Perdas de estoques por incêndio, enchente ou sinistro são reconhecidas como:',['despesa ou perda do período.','custo normal da produção.','estoque em elaboração.','receita operacional.','tributo recuperável.'],0,'Sinistros são perdas anormais no resultado.'],
['Valor justo x VRL','Sobre valor justo e valor realizável líquido, é correto afirmar que:',['são sempre iguais.','o VRL é específico da entidade, enquanto o valor justo reflete mercado.','o valor justo sempre substitui o custo dos estoques.','o VRL ignora gastos de venda.','ambos são sempre maiores que o custo.'],1,'VRL é específico da entidade; valor justo reflete mercado.'],
['Preço de reposição','Se o preço de reposição de um estoque aumenta após a compra, a entidade deve:',['aumentar automaticamente o estoque.','manter o estoque pelo custo, salvo aplicação da regra custo x VRL.','registrar receita financeira.','reclassificar o estoque para imobilizado.','reconhecer ajuste de avaliação patrimonial.'],1,'O estoque não aumenta pelo simples aumento do preço de reposição.'],
['Materiais para produção','Materiais mantidos para uso na produção não são reduzidos abaixo do custo quando:',['forem obsoletos.','for previsível que os produtos acabados sejam vendidos pelo custo ou acima do custo.','o fornecedor aumentar o preço.','o estoque estiver em local diferente.','sempre houver perda.'],1,'Se produtos acabados serão vendidos pelo custo ou acima dele, os materiais não são reduzidos.'],
['Produto agrícola colhido','O produto agrícola colhido de ativo biológico deve entrar no estoque inicialmente pelo:',['custo histórico da semente.','valor justo deduzido dos gastos estimados no ponto de venda na colheita.','preço de venda futuro sem deduções.','valor de reposição.','custo médio ponderado dos últimos anos.'],1,'Esse é o custo inicial para aplicação do CPC 16.'],
['Divulgação de estoques','As demonstrações contábeis devem divulgar:',['apenas o número de unidades em estoque.','políticas contábeis, critérios de valoração e valores escriturados dos estoques.','somente o preço de venda.','apenas o valor do estoque vencido.','somente o método fiscal.'],1,'O CPC 16 exige divulgação de políticas, critérios e valores escriturados.'],
['Estoque dado em garantia','Estoques dados como garantia de passivos devem ser:',['obrigatoriamente baixados.','divulgados nas demonstrações contábeis.','transferidos para patrimônio líquido.','reconhecidos como receita.','excluídos do ativo circulante sempre.'],1,'O CPC 16 exige divulgação do montante dado em garantia.'],
['Reconhecimento como despesa','O valor dos estoques reconhecido como despesa durante o período deve ser:',['ignorado nas notas explicativas.','divulgado.','sempre classificado como investimento.','registrado como passivo.','lançado em reserva de lucros.'],1,'Deve ser divulgado.'],
['Estoque de serviços','Quando aplicável, estoques de prestadores de serviços correspondem:',['a todos os salários da administração.','a custos do serviço em andamento ainda não reconhecido como receita.','a receitas recebidas antecipadamente.','a despesas comerciais.','a todo o patrimônio da empresa.'],1,'Podem representar custos de serviços em andamento.'],
['Margem de lucro','A margem de lucro esperada pela entidade deve ser incluída no custo dos estoques?',['Sim, sempre.','Sim, quando o estoque for vendido.','Não, o custo não inclui margem de lucro esperada.','Sim, se houver lucro bruto.','Sim, quando o preço de venda aumentar.'],2,'O custo não inclui lucro esperado.'],
['Gastos para concretizar venda','Na apuração do valor realizável líquido, os gastos necessários para concretizar a venda devem ser:',['somados ao preço de venda.','deduzidos do preço de venda estimado.','ignorados.','registrados como estoque adicional.','tratados como receita.'],1,'Gastos de venda são deduzidos na apuração do VRL.'],
['Custo acima do VRL','Se o custo do estoque é R$ 100 e o VRL é R$ 90, o estoque deve ser apresentado por:',['R$ 100.','R$ 95.','R$ 90.','R$ 190.','R$ 10.'],2,'Usa-se o menor: R$ 90.'],
['Custo abaixo do VRL','Se o custo do estoque é R$ 100 e o VRL é R$ 130, o estoque deve ser apresentado por:',['R$ 130.','R$ 115.','R$ 100.','R$ 30.','R$ 230.'],2,'Usa-se o menor: custo de R$ 100.'],
['Curso normal dos negócios','Mercadorias adquiridas para revenda no curso normal dos negócios devem ser classificadas, em regra, como:',['ativo imobilizado.','ativo circulante - estoques.','patrimônio líquido.','despesa antecipada.','investimento.'],1,'Mercadorias para revenda são estoques, normalmente no ativo circulante.']
];
let current=0, answers=Array(questions.length).fill(null), aluno=localStorage.getItem('quiz_cpc16_aluno')||''; const main=document.getElementById('main'), letters=['A','B','C','D','E'];
function render(){let html=`<section class="screen intro"><h2>🚀 Comece o Quiz</h2><div class="card"><span class="badge">📱 Celular</span><span class="badge">🎯 CPC 16</span><span class="badge">🏆 FGV</span><span class="badge">✅ 50 questões</span><p>Digite seu nome para iniciar ou continuar.</p><input id="studentName" placeholder="Nome do aluno" value="${aluno}"><div class="err" id="nameError">Digite o nome antes de iniciar.</div><p><strong>Modelo:</strong> primeira tela com a questão; segunda tela com gabarito e comentário.</p><button class="startbtn" onclick="startQuiz()">▶ Iniciar Quiz</button><button class="startbtn" onclick="continueSaved()">▶ Continuar de onde parei</button></div></section>`; questions.forEach((q,i)=>{html+=`<section class="screen questionScreen"><div class="qmeta"><div class="qnum">Questão ${i+1} de ${questions.length}</div><div class="qtema">FGV • ${q[0]}</div></div><div class="question">${q[1]}</div><div class="options">${q[2].map((o,idx)=>`<button class="opt" id="opt-${i}-${idx}" onclick="answer(${i},${idx})">${letters[idx]}) ${o}</button>`).join('')}</div><div class="alert">Responda e avance para ver o gabarito comentado ➡</div></section>`; html+=`<section class="screen answerScreen"><div class="qmeta"><div class="qnum">Gabarito da Questão ${i+1}</div><div class="qtema">FGV • ${q[0]}</div></div><div class="comment"><div class="answer">Gabarito: ${letters[q[3]]}</div><p>${q[4]}</p></div><div class="card"><h3>📌 Revisão rápida</h3><p>Compare sua resposta com o comentário e avance para a próxima questão.</p></div></section>`}); html+=`<section class="screen end"><h2>🏁 Fim do Quiz</h2><div class="card"><p>Parabéns, <strong id="finalName">${aluno||'Aluno'}</strong>!</p><p>Você concluiu as 50 questões teóricas do CPC 16.</p><div class="stats"><div class="stat">✅ Acertos<br><span id="endOk">0</span></div><div class="stat">❌ Erros<br><span id="endNo">0</span></div></div><button class="startbtn" onclick="restart()">🔄 Fazer novamente</button></div><div class="card"><h3>🧠 Revisão final</h3><ul><li>Estoque: menor entre custo e VRL.</li><li>Frete sobre compra entra; frete sobre venda não entra.</li><li>Tributo recuperável não entra no custo.</li><li>Juros embutidos são despesa financeira.</li><li>Perdas anormais são despesas do período.</li></ul></div></section>`; main.innerHTML=html; restoreVisualAnswers(); show(current)}
function startQuiz(){const inp=document.getElementById('studentName'),err=document.getElementById('nameError'); const nome=(inp?inp.value:'').trim(); if(nome.length<3){if(err)err.style.display='block'; if(inp)inp.focus(); return} aluno=nome; localStorage.setItem('quiz_cpc16_aluno',aluno); if(current===0)current=1; show(current)}
function continueSaved(){const saved=parseInt(localStorage.getItem('quiz_cpc16_current')); const savedAluno=localStorage.getItem('quiz_cpc16_aluno')||aluno; if(savedAluno)aluno=savedAluno; if(!isNaN(saved)&&saved>0){show(saved)}else{startQuiz()}}
function show(idx){const screens=document.querySelectorAll('.screen'); if(idx<0)idx=0; if(idx>=screens.length)idx=screens.length-1; if(idx>0&&!aluno){current=0}else{current=idx} screens.forEach(s=>s.classList.remove('active')); screens[current].classList.add('active'); localStorage.setItem('quiz_cpc16_current',current); updateProgress(); if(current===questions.length*2+1)updateEnd(); window.scrollTo(0,0)}
function nextScreen(){if(current===0){startQuiz();return} show(current+1)} function prevScreen(){show(current-1)}
function restart(){current=0;answers=Array(questions.length).fill(null);localStorage.removeItem('quiz_cpc16_answers');localStorage.removeItem('quiz_cpc16_current');render()}
function answer(qi,oi){if(answers[qi]!==null)return; answers[qi]=oi; localStorage.setItem('quiz_cpc16_answers',JSON.stringify(answers)); markOptions(qi); updateProgress()}
function markOptions(qi){const q=questions[qi]; q[2].forEach((_,idx)=>{const el=document.getElementById(`opt-${qi}-${idx}`); if(!el)return; el.classList.add('disabled'); if(idx===q[3])el.classList.add('correct'); if(answers[qi]===idx&&idx!==q[3])el.classList.add('wrong')})}
function restoreVisualAnswers(){questions.forEach((_,i)=>{if(answers[i]!==null)setTimeout(()=>markOptions(i),0)})}
function updateProgress(){const total=questions.length*2+2, ok=answers.filter((a,i)=>a===questions[i][3]).length, done=answers.filter(a=>a!==null).length, no=done-ok; document.getElementById('progress').innerText=`Tela ${current+1} de ${total} • ${aluno?('Aluno: '+aluno+' • '):''}Respondidas: ${done}/${questions.length} • ✅ ${ok} • ❌ ${no}`; document.getElementById('mini').innerHTML=questions.map((q,i)=>{let cls='dot'; if(answers[i]!==null)cls+=answers[i]===q[3]?' ok':' no'; if(current===i*2+1||current===i*2+2)cls+=' now'; return `<span class="${cls}"></span>`}).join('')}
function updateEnd(){const ok=answers.filter((a,i)=>a===questions[i][3]).length, done=answers.filter(a=>a!==null).length, no=done-ok; document.getElementById('endOk').textContent=ok; document.getElementById('endNo').textContent=no; const fn=document.getElementById('finalName'); if(fn)fn.textContent=aluno||'Aluno'}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nextScreen(); if(e.key==='ArrowLeft')prevScreen()}); try{const sa=JSON.parse(localStorage.getItem('quiz_cpc16_answers')); if(Array.isArray(sa)&&sa.length===questions.length)answers=sa; const sc=parseInt(localStorage.getItem('quiz_cpc16_current')); if(!isNaN(sc))current=sc}catch(e){} render();
</script></body></html>
